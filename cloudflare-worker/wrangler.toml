# EMS Companion — Cloudflare Worker 설정
#
# 배포:
#   wrangler login           # 한 번만
#   wrangler secret put OPENAI_API_KEY     # 시크릿 등록 (한 번만)
#   wrangler secret put SHARED_SECRET      # 클라이언트 인증용 (한 번만)
#   wrangler deploy                        # 배포
#
# 로컬 개발:
#   wrangler dev             # http://localhost:8787 에 띄움
#   .dev.vars 파일로 로컬 시크릿 관리 (gitignore 처리)

name = "ems-companion-api"
main = "src/index.js"
compatibility_date = "2026-05-01"

# 정적 자산: binding 모드.
# binding 을 명시하면 정적 자산 자동 라우팅이 비활성화되고,
# 모든 요청이 worker script (Hono) 로 옴 — API 워커에 정확히 맞는 모드.
# (이 워커는 정적 자산을 안 쓰지만, wrangler 가 docs/ 자동 발견하는 걸 막기 위해 빈 폴더 명시.)
[assets]
directory = "./public"
binding = "ASSETS"

# 무료 티어 한도:
#   - 10만 요청/일
#   - 10ms CPU/요청 (외부 API 응답 대기는 CPU time 미계산)
#   - 100MB 요청 본문
# 음성 5분 = 약 30MB → 무료 한도 안전
