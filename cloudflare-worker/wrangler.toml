# EMS Companion — Cloudflare Worker 설정
#
# 배포:
#   wrangler login           # 한 번만
#   wrangler secret put OPENAI_API_KEY     # 시크릿 등록 (한 번만)
#   wrangler secret put SHARED_SECRET      # 클라이언트 인증용 (한 번만)
#   wrangler deploy                        # 배포
#
# 로컬 개발:
#   wrangler dev             # http://localhost:8787 에 띄움
#   .dev.vars 파일로 로컬 시크릿 관리 (gitignore 처리)

name = "ems-api"
main = "src/index.js"
compatibility_date = "2026-05-01"

# 이 워커는 순수 API 서버 (정적 자산 없음).
# [assets] 섹션을 명시하면 wrangler 가 워커 모드를 "Static Site + Worker" 로
# 전환해서 라우팅이 깨짐. 따라서 [assets] 섹션 자체를 두지 않음.

# 무료 티어 한도:
#   - 10만 요청/일
#   - 10ms CPU/요청 (외부 API 응답 대기는 CPU time 미계산)
#   - 100MB 요청 본문
# 음성 5분 = 약 30MB → 무료 한도 안전
