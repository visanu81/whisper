# EMS Companion — Cloudflare Worker 설정
#
# 배포:
#   wrangler login           # 한 번만
#   wrangler secret put OPENAI_API_KEY     # 시크릿 등록 (한 번만)
#   wrangler secret put SHARED_SECRET      # 클라이언트 인증용 (한 번만)
#   wrangler deploy                        # 배포
#
# 로컬 개발:
#   wrangler dev             # http://localhost:8787 에 띄움
#   .dev.vars 파일로 로컬 시크릿 관리 (gitignore 처리)

name = "ems-api"
main = "src/index.js"
compatibility_date = "2026-05-01"

# 정적 자산: cloudflare-worker/public/ 빈 폴더로 명시.
# wrangler v4 가 미설정 시 sibling 폴더(../docs)를 자동 발견하므로,
# 명시적으로 빈 폴더를 가리켜 docs/ 자동 발견을 차단.
# binding="ASSETS" 로 정적 자산 자동 라우팅을 OFF →
# 모든 요청이 worker script (Hono) 로 옴.
[assets]
directory = "./public"
binding = "ASSETS"

# KV namespace — 출동 기록 통합 저장소 (관리자 대시보드용)
# 사장님이 `npx wrangler kv namespace create EMS_RECORDS` 로 생성 후
# 출력된 id 를 아래에 채워주세요. (지금은 placeholder)
[[kv_namespaces]]
binding = "EMS_RECORDS"
id = "0c4054e22c184c6eb687bfcf181e7325"

# 무료 티어 한도:
#   - 10만 요청/일
#   - 10ms CPU/요청 (외부 API 응답 대기는 CPU time 미계산)
#   - 100MB 요청 본문
# 음성 5분 = 약 30MB → 무료 한도 안전
